apiVersion: apps/v1
kind: Deployment
metadata:
  name: decision-deployment
  labels:
    app: decision
spec:
  replicas: 1
  selector:
    matchLabels:
      app: decision
  template:
    metadata:
      labels:
        app: decision
    spec:
      containers:
        - name: decision
          image: decision:latest
          imagePullPolicy: IfNotPresent
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 256Mi
          ports:
            - containerPort: 3000
---
apiVersion: v1
kind: Service
metadata:
  name: decision-service
  labels:
    app: decision
spec:
  selector:
    app: decision
  ports:
    - port: 3000
      targetPort: 3000
