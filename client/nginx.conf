server {
    listen 80;
    server_name localhost;

    location / {
        root /usr/share/nginx/html;
        index index.html index.htm;
        try_files $uri $uri/ /index.html;
    }

    # Proxy hacia el microservicio de eventos interno en k8s
    location /api/ {
        proxy_pass http://eventos-service:3000/api/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    location /health-eventos {
        proxy_pass http://eventos-service:3000/health;
    }

    location /metrics {
        proxy_pass http://eventos-service:3000/metrics;
    }

    # Proxy hacia el microservicio de difusión interno en k8s
    location /health-difusion {
        proxy_pass http://difusion-service:4000/health;
    }

    location /socket.io/ {
        proxy_pass http://difusion-service:4000/socket.io/;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "Upgrade";
        proxy_set_header Host $host;
    }
}
